<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>塔</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main id="game">

    <!-- ========================================
         タイトル
    ========================================= -->

    <header id="gameHeader">

      <h1>
        T・O・U
      </h1>

      <div class="subtitle">
        ～終わりなき頂へ～
      </div>

    </header>


    <!-- ========================================
         ステータス
    ========================================= -->

    <section id="status">

      <span>
        階:
        <b id="floor">1</b>F
      </span>

      <span>
        Lv:
        <b id="level">1</b>
      </span>

      <span>
        HP:
        <b id="hp">20</b>
        /
        <b id="maxHp">20</b>
      </span>

      <span>
        満腹度:
        <b id="hunger">100</b>
      </span>

      <span>
        EXP:
        <b id="exp">0</b>
      </span>

    </section>


    <!-- ========================================
         ゲーム画面
    ========================================= -->

    <section id="gameScreen">

      <canvas id="canvas">
        Canvasに対応したブラウザでプレイしてください。
      </canvas>

    </section>


    <!-- ========================================
         メッセージ
    ========================================= -->

    <section id="messagePanel">

      <div class="panelTitle">
        メッセージ
      </div>

      <div id="message"></div>

    </section>


    <!-- ========================================
         鞄 + 移動操作

         左 = 鞄
         右 = 移動
    ========================================= -->

    <section id="controlArea">


      <!-- ======================================
           左側：鞄
      ======================================= -->

      <section id="inventorySection">

        <div class="sectionHeader">

          <h2>
            鞄
          </h2>

          <button
            id="inventoryButton"
            type="button"
          >
            鞄を見る
          </button>

        </div>


        <!-- 鞄本体 -->

        <div
          id="inventoryPanel"
          hidden
        >

          <div class="inventoryHeader">

            <h3>
              鞄
            </h3>

            <span id="inventoryCount">
              0/20
            </span>

          </div>
          


          <!--
            game.js がここに
            所持アイテムを追加する
          -->

          <div id="inventoryList"></div>


          <!-- ==================================
               選択したアイテム
          =================================== -->

          <div
            id="inventoryActions"
            hidden
          >

            <div id="selectedItemBox">

              <h4 id="selectedItemName">
                アイテム名
              </h4>

              <p id="selectedItemDescription">
              </p>

            </div>


            <!-- アイテム操作 -->

            <div class="inventoryActionButtons">

              <button
                id="useInventoryItem"
                type="button"
              >
                使う
              </button>


              <button
                id="equipInventoryItem"
                type="button"
              >
                装備
              </button>
              <button id="shootArrowButton" hidden>
                矢を撃つ
              </button>


              <button
                id="useStaffButton"
                type="button"
              >
                杖を振る
              </button>


              <button
                id="dropInventoryItem"
                type="button"
              >
                置く
              </button>

            </div>

          </div>


          <button
            id="closeInventoryButton"
            class="closeButton"
            type="button"
          >
            閉じる
          </button>

        </div>

      </section>


      <!-- ======================================
           右側：移動
      ======================================= -->

      <section id="controlPanel">

        <h2>
          移動
        </h2>


        <!-- 8方向移動 -->

        <div
          id="dpad"
          class="controls"
        >

          <!-- 上段 -->

          <button
            type="button"
            data-dir="upLeft"
            aria-label="左上へ移動"
          >
            ↖
          </button>


          <button
            type="button"
            data-dir="up"
            aria-label="上へ移動"
          >
            ↑
          </button>


          <button
            type="button"
            data-dir="upRight"
            aria-label="右上へ移動"
          >
            ↗
          </button>


          <!-- 中段 -->

          <button
            type="button"
            data-dir="left"
            aria-label="左へ移動"
          >
            ←
          </button>


          <button
            type="button"
            id="wait"
            aria-label="その場で待機"
          >
            ・
          </button>


          <button
            type="button"
            data-dir="right"
            aria-label="右へ移動"
          >
            →
          </button>


          <!-- 下段 -->

          <button
            type="button"
            data-dir="downLeft"
            aria-label="左下へ移動"
          >
            ↙
          </button>


          <button
            type="button"
            data-dir="down"
            aria-label="下へ移動"
          >
            ↓
          </button>


          <button
            type="button"
            data-dir="downRight"
            aria-label="右下へ移動"
          >
            ↘
          </button>

        </div>


        <!-- ==================================
             足元アイテム
        =================================== -->

        <div
          id="itemActions"
          hidden
        >

          <div class="groundItemTitle">
            足元のアイテム
          </div>


          <div id="groundItemName">
          </div>


          <div class="groundItemButtons">

            <button
              id="useGroundItem"
              type="button"
            >
              今すぐ使う
            </button>


            <button
              id="pickupGroundItem"
              type="button"
            >
              鞄にしまう
            </button>


            <button
              id="equipGroundItem"
              type="button"
            >
              装備する
            </button>

          </div>

        </div>

      </section>

    </section>


    <!-- ========================================
         システムボタン
    ========================================= -->

    <section
      id="systemButtons"
      class="actions"
    >

      <button
        id="save"
        type="button"
      >
        セーブ
      </button>


      <button
        id="load"
        type="button"
      >
        ロード
      </button>


      <button
        id="newGame"
        type="button"
      >
        最初から
      </button>

    </section>


    <!-- ========================================
         操作説明
    ========================================= -->

    <section id="helpPanel">

      <details>

        <summary>
          操作方法
        </summary>

        <div class="helpContent">

          <p>
            PC：
            矢印キー / WASDで移動できます。
          </p>

          <p>
            斜め移動は画面上の
            ↖ ↗ ↙ ↘ ボタンを使用できます。
          </p>

          <p>
            スペースキーでその場に待機します。
          </p>

          <p>
            アイテムの上に乗ると、
            使用・収納・装備などの操作が表示されます。
          </p>

        </div>

      </details>

    </section>

  </main>


  <!-- ========================================
       JavaScript
  ========================================= -->

  <script src="game.js"></script>

</body>

</html>
